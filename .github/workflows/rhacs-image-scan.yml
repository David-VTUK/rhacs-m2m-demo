name: RHACS Image Scan (M2M)

on:
  workflow_call:
    inputs:
      image:
        description: "Full image reference to scan (e.g. quay.io/org/app:latest)"
        required: true
        type: string

permissions:
  id-token: write # This is required for requesting the JWT

jobs:
  rhacs-image-scan:
    name: Scan image with RHACS
    runs-on: ubuntu-latest

    steps:
      - name: Resolve image ref
        shell: bash
        run: echo "IMAGE_REF=${{ inputs.image }}" >> "$GITHUB_ENV"

      - name: Central Login
        uses: stackrox/central-login@v1
        with:
          endpoint: https://central-rhacs-operator.apps.ocp.tfrbr.sandbox232.opentlc.com:443
      - name: Install roxctl
        uses: stackrox/roxctl-installer-action@v1
        with:
          central-endpoint: ${{ env.CENTRAL_ENDPOINT }}
          central-token: ${{ env.ROX_API_TOKEN }}
      - name: Scan image with roxctl
        shell: bash
        run: |
          set -euo pipefail
          roxctl image scan --output=table --insecure-skip-tls-verify --image="${{ env.IMAGE_REF }}"

